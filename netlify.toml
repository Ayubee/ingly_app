[build]
  command = "npm --prefix admin ci && npm --prefix admin run build -- --mode $APP_ENV"
  publish = "admin/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
