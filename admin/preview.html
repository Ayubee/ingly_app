<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingly - Web Admin Panel</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/environment.js"></script>
  <script src="/auth.js"></script>
  <script src="/real-data.js"></script>
  <script src="/real-data-ui.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              500: '#6366F1',
              600: '#5B4DFF',
              700: '#4338CA',
            },
            accent: {
              400: '#38BDF8',
              500: '#0EA5E9',
            },
            state: {
              mastered: '#22C55E',
              review: '#0EA5E9',
              hard: '#EF4444',
              streak: '#F97316'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
    .squircle { border-radius: 24px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-brand-500 selection:text-white">
  <div id="ingly-environment" role="status" style="position:fixed;right:8px;top:8px;z-index:10000;padding:4px 8px;border-radius:6px;background:#fef3c7;color:#78350f;font:600 10px sans-serif;pointer-events:none">CONFIG REQUIRED</div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 7 ta mashhur film uchun sinovdan o'tgan, ochiq YouTube rasmiy treyler ID-lari
    const MOVIE_TRAILERS = {
      'harry potter': 'mObK5XD8udk',
      'friends': '8wThS5WCzs4',
      'avengers: endgame': 'TcMBFSGVi1c',
      'the lion king': '7TavVZMewpY',
      'sherlock holmes': 'J7nJksXDBWc',
      'forrest gump': 'bLvqoHBptjg',
      'spider-man': 'JfVOs4VSpmA'
    };

    const getMovieTrailerId = (movieName) => {
      if (!movieName) return 'mObK5XD8udk';
      const lower = movieName.toLowerCase().trim();
      for (const [k, id] of Object.entries(MOVIE_TRAILERS)) {
        if (lower.includes(k) || k.includes(lower)) return id;
      }
      return 'mObK5XD8udk';
    };

    // Tezkor, yengil va 100% ishlaydigan HTML5 MP4 videolari
    const SAMPLE_MP4_CLIPS = [
      'https://www.w3schools.com/html/mov_bbb.mp4',
      'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
      'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/friday.mp4',
      'https://www.w3schools.com/tags/movie.mp4'
    ];

    // =========================================================================
    // INGLY DEFENSIVE CRYPTOGRAPHY LAYER (FIPS 180-4 SHA-256 + Salted Hashing)
    // =========================================================================

    // Super admin paroli xavfsiz heshi (Salted SHA-256)
    const { Dashboard: RealDashboard, Finance: RealFinance, Monetization: RealMonetization } = window.inglyRealUI || {};

    function App() {
      const adminDataGeneration = window.inglyRealData?.api.generation();
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [adminLoginInput, setAdminLoginInput] = useState('');
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [authError, setAuthError] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [verifiedAdmin, setVerifiedAdmin] = useState(null);
      useEffect(() => {
        let mounted = true;
        let requestVersion = 0;
        let acceptedAdminId = null;
        const check = async () => {
          const version = ++requestVersion;
          try {
            const access = await window.inglyAuth.authorize();
            if (mounted && version === requestVersion) {
              if (acceptedAdminId !== access.id) { setUsers([]); setAdminList([]); }
              acceptedAdminId = access.id; setVerifiedAdmin(access); setIsAdminLoggedIn(true);
            }
          } catch {
            if (mounted && version === requestVersion) { acceptedAdminId = null; setVerifiedAdmin(null); setIsAdminLoggedIn(false); setUsers([]); setAdminList([]); }
          }
        };
        check();
        const { data } = window.inglyAuth.client.auth.onAuthStateChange(() => { setTimeout(() => { if (mounted) check(); }, 0); });
        return () => { mounted = false; data.subscription.unsubscribe(); };
      }, []);
      const handleAdminLogin = async (e) => {
        if (e) e.preventDefault();
        try {
          const access = await window.inglyAuth.login(adminLoginInput.trim(), adminPasswordInput);
          setVerifiedAdmin(access); setIsAdminLoggedIn(true); setAdminPasswordInput(''); setAuthError('');
        } catch (error) { setAuthError(error.message || 'Tasdiqlangan admin email/parol yoki ruxsat talab qilinadi.'); setAdminPasswordInput(''); }
      };
      const handleAdminLogout = async () => {
        setVerifiedAdmin(null); setIsAdminLoggedIn(false); setUsers([]); setAdminList([]);
        setAdminPasswordInput(''); setNewPasswordInput(''); setPasswordModalUser(null);
        setAdminForm(prev => ({...prev,password:''})); setNewUserForm(prev => ({...prev,password:''}));
        setShowAdminModal(false); setShowAddUserModal(false); setShowPermsModal(false);
        setVipModalUser(null); setSelectedAdmin(null);
        await window.inglyAuth.logout();
      };

      const [tab, setTab] = useState('dashboard');
      const [videosEnabled, setVideosEnabled] = useState(() => {
        const saved = window.inglyAuth.localStorage.getItem('ingly_videos_enabled');
        return saved !== null ? JSON.parse(saved) : true;
      });
      useEffect(() => {
        if (!isAdminLoggedIn) return;
        return window.inglyRealData.api.subscribe((kind, config) => {
          if (kind === 'configuration' && config?.videos_enabled !== undefined)
            setVideosEnabled(config.videos_enabled === true || config.videos_enabled === 'true');
        });
      }, [isAdminLoggedIn]);
      const [announcementForm, setAnnouncementForm] = useState({
        title: "Mening Lug'atim & Tarjimon",
        subtitle: "Istalgan so'zni yozing, tarjima qiling va kartochkalarda yodlang!",
        icon: "✍️",
        tag: "YANGI",
        screen: "MyWords",
      });
      const [currentAnnouncement, setCurrentAnnouncement] = useState(() => {
        const saved = window.inglyAuth.localStorage.getItem('ingly_latest_announcement');
        try { return saved ? JSON.parse(saved) : null; } catch (e) { return null; }
      });

      const [selectedMovie, setSelectedMovie] = useState(null);
      const [videoTab, setVideoTab] = useState('youtube'); // 'youtube' yoki 'html5'
      const [videoMuted, setVideoMuted] = useState(true);
      const [searchTerm, setSearchTerm] = useState('');
      const [activeBook, setActiveBook] = useState(1);
      const [toast, setToast] = useState('');

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };

      const [users, setUsers] = useState([]);

      const [allWords, setAllWords] = useState([]);
      const [selectedBook, setSelectedBook] = useState(1);
      const [selectedUnit, setSelectedUnit] = useState('all');
      const [page, setPage] = useState(1);
      const pageSize = 20;

      // Word Modal (Add / Edit) State
      const [showWordModal, setShowWordModal] = useState(false);
      const [editingWord, setEditingWord] = useState(null);
      const [wordForm, setWordForm] = useState({
        word: '',
        phonetic: '',
        pos: 'noun',
        uzbek: '',
        definition: '',
        definition_uz: '',
        example: '',
        example_uz: '',
        book: 1,
        unit: 1,
        video_clip_url: ''
      });

      // Admins & Permissions State
      const ALL_PERMISSIONS = [
        { id: 'manage_words', label: 'So\'zlarni tahrirlash va qo\'shish', desc: '4000 ta so\'z bazasini boshqarish' },
        { id: 'manage_users', label: 'Foydalanuvchilarni boshqarish', desc: 'Foydalanuvchilarni ko\'rish, bloklash va ochish' },
        { id: 'manage_settings', label: 'Monetizatsiya va Sozlamalar', desc: 'AdMob reklama, VIP obuna va kalitlarni sozlash' },
        { id: 'view_analytics', label: 'Statistika va tahlil', desc: 'Tasdiqlangan umumiy ko‘rsatkichlar' },
        { id: 'view_finance', label: 'Moliyani ko‘rish', desc: 'Moliya reyestri va eksport' },
        { id: 'manage_finance', label: 'Moliyani boshqarish', desc: 'Qo‘lda yozuv kiritish va hisobdan chiqarish' },
        { id: 'manage_admins', label: 'Adminlarni boshqarish (RBAC)', desc: 'Yangi adminlar tayinlash va huquq berish' },
        { id: 'all', label: 'Barcha Huquqlar (Cheklovlarsiz)', desc: 'Tizim bo\'yicha to\'liq Super Admin huquqi' }
      ];

      const ROLE_LABELS = {
        super_admin: 'Super Admin',
        editor: 'Kontent Menejer',
        moderator: 'Moderator'
      };

      const [adminList, setAdminList] = useState([]);

      const [showAdminModal, setShowAdminModal] = useState(false);
      const [showPermsModal, setShowPermsModal] = useState(false);
      const [selectedAdmin, setSelectedAdmin] = useState(null);
      const [adminForm, setAdminForm] = useState({
        name: '',
        username: '',
        password: '',
        role: 'editor',
        perms: ['manage_words']
      });

      // Foydalanuvchi parolini o'zgartirish modali
      const [passwordModalUser, setPasswordModalUser] = useState(null);
      const [newPasswordInput, setNewPasswordInput] = useState('');
      const [showNewPassword, setShowNewPassword] = useState(false);
      const [isSavingPassword, setIsSavingPassword] = useState(false);

      // Foydalanuvchiga VIP / Premium berish modali
      const [vipModalUser, setVipModalUser] = useState(null);
      const [vipDurationDays, setVipDurationDays] = useState(30);
      const [isSavingVip, setIsSavingVip] = useState(false);

      const LIVE_SUPABASE_URL = window.inglyAuth.url;
      const LIVE_SUPABASE_KEY = window.inglyAuth.anonKey;

      const [supabaseUrl, setSupabaseUrl] = useState(LIVE_SUPABASE_URL);
      const [supabaseKey, setSupabaseKey] = useState(LIVE_SUPABASE_KEY);
      const [supabaseConnected, setSupabaseConnected] = useState(false);
      const [showSupabaseModal, setShowSupabaseModal] = useState(false);
      const [supabaseClient, setSupabaseClient] = useState(null);

      // Foydalanuvchilar ro'yxatini Supabase'dan yuklash
      const loadUsersFromSupabase = async (customClient = null) => {
        const client = customClient || supabaseClient;
        if (!client) return;
        try {
          const access = await window.inglyAuth.authorize();
          // Safe profile columns only; passwords belong to Supabase Auth.
          const { data: rawUsers, error: usersErr } = await client
            .from('users')
            .select('id,auth_user_id,full_name,username,phone,is_blocked,is_premium,premium_until,created_at,updated_at')
            .order('created_at', { ascending: false });

          // 2. Statistika (v_user_stats) dan yodlangan so'zlar va streak ma'lumotlarini olish
          let statsMap = new Map();
          try {
            const { data: statsData } = await client.from('v_user_stats').select('*');
            if (Array.isArray(statsData)) {
              statsData.forEach(s => {
                if (s.user_id) statsMap.set(String(s.user_id), s);
                if (s.username) statsMap.set(String(s.username).toLowerCase(), s);
              });
            }
          } catch (stErr) {}

          const currentAccess = await window.inglyAuth.authorize();
          if (currentAccess.id !== access.id) return;
          if (!usersErr && Array.isArray(rawUsers)) {
            const mapped = rawUsers.map(u => {
              const uStats = statsMap.get(String(u.id)) || statsMap.get(String(u.username || '').toLowerCase()) || {};
              return {
                id: u.id,
                name: u.full_name || 'Noma\'lum',
                phone: u.phone || '-',
                username: u.username || 'user',
                words: Number(uStats.mastered_words_count || u.total_words_learned || 0),
                streak: Number(uStats.current_streak || u.current_streak || 0),
                isBlocked: !!u.is_blocked,
                isVip: !!u.is_premium,
                created_at: u.created_at,
                updated_at: u.updated_at
              };
            });
            setUsers(mapped);

            return;
          }
        } catch (e) {
          console.warn('loadUsersFromSupabase xatosi:', e);
        }
      };

      const initSupabaseConnection = async (url, key) => {
        if (!url || !key) return;
        try {
          const initiatingAccess = await window.inglyAuth.authorize();
          if (window.supabase) {
            const client = window.inglyAuth.client;
            setSupabaseClient(client);

            // 1. App settings ni o'qish (ads, vip, free books)
            client.from('app_settings').select('setting_key,setting_value').in('setting_key', ['videos_enabled','latest_announcement']).then(async ({ data, error }) => {
              const currentAccess = await window.inglyAuth.authorize();
              if (currentAccess.id !== initiatingAccess.id) return;
              if (!error && Array.isArray(data)) {
                setSupabaseConnected(true);
                data.forEach(item => {
                  if (item.setting_key === 'videos_enabled') {
                    const val = item.setting_value === true || item.setting_value === 'true';
                    setVideosEnabled(val);
                    window.inglyAuth.localStorage.setItem('ingly_videos_enabled', JSON.stringify(val));
                  } else if (item.setting_key === 'latest_announcement') {
                    const parsed = typeof item.setting_value === 'string' && item.setting_value.startsWith('{')
                      ? JSON.parse(item.setting_value)
                      : item.setting_value;
                    setCurrentAnnouncement(parsed || null);
                    if (parsed) window.inglyAuth.localStorage.setItem('ingly_latest_announcement', JSON.stringify(parsed));
                  }
                });
                showToast('Supabase sozlamalari yuklandi!');
              } else {
                setSupabaseConnected(false);
                console.warn('Supabase app_settings fetch xatosi:', error);
              }
            }).catch(() => setSupabaseConnected(false));

            // 2. Foydalanuvchilar ro'yxatini yuklash
            loadUsersFromSupabase(client);

            // Private user rows are not published to Realtime. Reload over authorized REST.
          }
        } catch (e) {
          console.error('Supabase init xatosi:', e);
        }
      };

      useEffect(() => {
        if (!isAdminLoggedIn) return;
        initSupabaseConnection(window.inglyAuth.url, window.inglyAuth.anonKey);
        window.inglyAuth.client.from('admins').select('id,auth_user_id,full_name,username,role,permissions,is_active').then(async ({data,error}) => {
          const access = await window.inglyAuth.authorize();
          if (access.id !== verifiedAdmin.id) return;
          if (!error && data) setAdminList(data.map(a => ({...a,name:a.full_name,perms:a.permissions,isActive:a.is_active,roleLabel:a.role})));
        }).catch(() => {});
        return () => { window.inglyAuth.client.removeAllChannels(); };
      }, [isAdminLoggedIn, verifiedAdmin?.id]);

      useEffect(() => {
        fetch('./all_words.json')
          .then(r => r.json())
          .then(data => {
            // LocalStorage'dagi maxsus tahrirlangan so'zlarni birlashtirish
            const customWordsStr = window.inglyAuth.localStorage.getItem('ingly_custom_words');
            let merged = data;
            if (customWordsStr) {
              try {
                const customWords = JSON.parse(customWordsStr);
                const customMap = new Map(customWords.map(w => [w.id, w]));
                merged = data.map(w => customMap.get(w.id) || w);
                // Agar yangi qo'shilgan so'zlar bo'lsa
                customWords.forEach(cw => {
                  if (!merged.some(w => w.id === cw.id)) {
                    merged.unshift(cw);
                  }
                });
              } catch (e) {}
            }
            setAllWords(merged);
            showToast(`Muvaffaqiyatli: ${merged.length} ta so'z yuklandi!`);
          })
          .catch(err => {
            console.error('So\'zlar yuklanmadi:', err);
          });
      }, []);

      const speakWord = (text) => {
        if ('speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
        }
      };

      // Barcha videolarni ko'rsatish/yashirish switchi (Global Feature Flag)
      const handleToggleVideos = async () => {
        if (adminDataGeneration !== window.inglyRealData.api.generation()) return;
        try {
          const config = await window.inglyRealData.api.configure({ videos_enabled: !videosEnabled });
          setVideosEnabled(config.videos_enabled === true);
          showToast('Sozlamalar serverda saqlandi.');
        } catch (error) { showToast(error.message); }
      };

      // Home Page Yangilik / E'lonini Chiqarish (Barcha foydalanuvchilar Home sahifasida ko'rinadi)
      const handlePublishAnnouncement = async () => {
        if (!announcementForm.title.trim()) {
          showToast('Iltimos, e\'lon sarlavhasini kiriting!');
          return;
        }
        const newAnn = {
          id: 'announcement_' + Date.now(),
          title: announcementForm.title.trim(),
          subtitle: announcementForm.subtitle.trim(),
          icon: announcementForm.icon || '✨',
          tag: announcementForm.tag || 'YANGI',
          screen: announcementForm.screen || 'MyWords',
          created_at: new Date().toISOString()
        };
        setCurrentAnnouncement(newAnn);
        window.inglyAuth.localStorage.setItem('ingly_latest_announcement', JSON.stringify(newAnn));
        showToast('Yangi e\'lon barcha foydalanuvchilar Home sahifasiga chiqarildi! 🚀');

        if (supabaseClient) {
          try {
            await supabaseClient.from('app_settings').upsert({
              setting_key: 'latest_announcement',
              setting_value: newAnn,
              description: 'Mobil ilova Home sahifasida ko\'rinadigan so\'nggi yangilik / e\'lon'
            }, { onConflict: 'setting_key' });
          } catch (e) {
            console.warn('Supabase announcement save error:', e);
          }
        }
      };

      // Home Page Yangilik / E'lonini O'chirish
      const handleClearAnnouncement = async () => {
        setCurrentAnnouncement(null);
        window.inglyAuth.localStorage.removeItem('ingly_latest_announcement');
        showToast('E\'lon Home sahifadan olib tashlandi! 🗑️');

        if (supabaseClient) {
          try {
            await supabaseClient.from('app_settings').upsert({
              setting_key: 'latest_announcement',
              setting_value: null,
              description: 'Mobil ilova Home sahifasida ko\'rinadigan so\'nggi yangilik / e\'lon'
            }, { onConflict: 'setting_key' });
          } catch (e) {
            console.warn('Supabase announcement clear error:', e);
          }
        }
      };

      // Foydalanuvchini bloklash / blokdan ochish
      const toggleBlockUser = async (id) => {
        const target = users.find(u => u.id === id);
        if (!target) return;
        try {
          const row = await window.inglyAuth.manage('updateUser', { id: target.id, is_blocked: !target.isBlocked });
          setUsers(prev => prev.map(u => u.id === target.id ? {...u,isBlocked:row.is_blocked} : u));
        } catch (err) { showToast(err.message); }
      };

      // Foydalanuvchiga VIP / Premium berish yoki bekor qilish
      const handleSaveUserVip = async (targetDurationDays = null) => {
        if (!vipModalUser) return;
        setIsSavingVip(true);
        try {
          const days = targetDurationDays === null ? vipDurationDays : targetDurationDays;
          const premium = days !== 0 && days !== 'revoke';
          const until = !premium ? null : days === 'lifetime' ? '2099-12-31T23:59:59Z' : new Date(Date.now() + Number(days) * 86400000).toISOString();
          const row = await window.inglyAuth.manage('updateUser', { id: vipModalUser.id, is_premium: premium, premium_until: until });
          setUsers(prev => prev.map(u => u.id === row.id ? {...u,isVip:row.is_premium,premiumUntil:row.premium_until} : u));
          setVipModalUser(null); showToast('Server tasdiqladi.');
        } catch (err) { showToast(err.message); }
        finally { setIsSavingVip(false); }
      };

      // Password reset is verified and executed by the trusted admin endpoint.
      const handleSaveUserPassword = async (e) => {
        if (e) e.preventDefault();
        if (!passwordModalUser || newPasswordInput.length < 6) { showToast('Parol kamida 6 ta belgi.'); return; }
        setIsSavingPassword(true);
        try {
          await window.inglyAuth.manage('resetPassword', { id: passwordModalUser.id, password: newPasswordInput });
          setNewPasswordInput(''); setPasswordModalUser(null); showToast('Auth parol yangilandi.');
        } catch (err) { showToast(err.message); }
        finally { setIsSavingPassword(false); }
      };

      // So'z qo'shish modalini ochish
      const openAddWordModal = () => {
        setEditingWord(null);
        setWordForm({
          word: '',
          phonetic: '',
          pos: 'noun',
          uzbek: '',
          definition: '',
          definition_uz: '',
          example: '',
          example_uz: '',
          book: selectedBook === 'all' ? 1 : Number(selectedBook),
          unit: selectedUnit === 'all' ? 1 : Number(selectedUnit),
          video_clip_url: ''
        });
        setShowWordModal(true);
      };

      // So'zni tahrirlash modalini ochish
      const openEditWordModal = (word) => {
        setEditingWord(word);
        setWordForm({
          word: word.word || '',
          phonetic: word.phonetic || word.ipa || '',
          pos: word.pos || 'noun',
          uzbek: word.uzbek || '',
          definition: word.definition || '',
          definition_uz: word.definition_uz || '',
          example: word.example || '',
          example_uz: word.example_uz || '',
          book: word.book || 1,
          unit: word.unit || 1,
          video_clip_url: word.video_clip_url || ''
        });
        setShowWordModal(true);
      };

      // So'zni saqlash (Add / Edit)
      const handleSaveWord = async (e) => {
        if (e) e.preventDefault();
        const cleanWord = wordForm.word.trim();
        const cleanUzbek = wordForm.uzbek.trim();

        if (!cleanWord || !cleanUzbek) {
          showToast('So\'z va o\'zbekcha ma\'nosini kiritish shart!');
          return;
        }

        let updatedList = [];
        let savedWordObj = null;

        if (editingWord) {
          savedWordObj = {
            ...editingWord,
            ...wordForm,
            word: cleanWord,
            uzbek: cleanUzbek,
            ipa: wordForm.phonetic || editingWord.ipa
          };
          updatedList = allWords.map(w => w.id === editingWord.id ? savedWordObj : w);
          showToast(`"${cleanWord}" so'zi muvaffaqiyatli yangilandi!`);
        } else {
          savedWordObj = {
            id: Date.now(),
            ...wordForm,
            word: cleanWord,
            uzbek: cleanUzbek,
            ipa: wordForm.phonetic,
            movie: 'Ingly HD Cinema',
            clip: `Ingly Cinema: ${cleanWord}`
          };
          updatedList = [savedWordObj, ...allWords];
          showToast(`Yangi "${cleanWord}" so'zi qo'shildi!`);
        }

        setAllWords(updatedList);
        setShowWordModal(false);

                        setSelectedAdmin({ ...selectedAdmin, role: newRole, perms: defaultPerms });
                      }}
                      class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-brand-500 bg-white"
                    >
                      <option value="editor">Kontent Menejer (Faqat so'zlar)</option>
                      <option value="moderator">Moderator (Foydalanuvchilarni bloklash)</option>
                      <option value="super_admin">Super Admin (Cheklanmagan huquq)</option>
                    </select>
                  </div>

                  <div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-200">
                    <div>
                      <div class="font-bold text-slate-800 text-xs">Admin Faolligi (Status)</div>
                      <div class="text-[11px] text-slate-400">O'chirilsa bu admin tizimga kira olmaydi</div>
                    </div>
                    <button
                      type="button"
                      onClick={() => setSelectedAdmin({ ...selectedAdmin, isActive: !selectedAdmin.isActive })}
                      class={`px-3 py-1.5 rounded-xl font-bold text-xs transition cursor-pointer ${selectedAdmin.isActive ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}
                    >
                      {selectedAdmin.isActive ? '✓ Faol' : '✕ Nofaol'}
                    </button>
                  </div>

                  <div>
                    <label class="block font-bold text-slate-700 mb-2">Ruxsatlar va Huquqlar (RBAC)</label>
                    <div class="space-y-2 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                      {ALL_PERMISSIONS.map(p => {
                        const permsList = Array.isArray(selectedAdmin.perms) ? selectedAdmin.perms : [];
                        const checked = permsList.includes(p.id);
                        return (
                          <label key={p.id} class="flex items-start gap-2.5 cursor-pointer">
                            <input 
                              type="checkbox"
                              checked={checked}
                              onChange={(e) => {
                                let newPerms = [...permsList];
                                if (e.target.checked) {
                                  if (!newPerms.includes(p.id)) newPerms.push(p.id);
                                } else {
                                  newPerms = newPerms.filter(id => id !== p.id);
                                }
                                setSelectedAdmin({ ...selectedAdmin, perms: newPerms });
                              }}
                              class="mt-0.5 rounded text-brand-600 focus:ring-brand-500 cursor-pointer"
                            />
                            <div>
                              <div class="font-bold text-slate-800 text-xs">{p.label}</div>
                              <div class="text-[11px] text-slate-400">{p.desc}</div>
                            </div>
                          </label>
                        );
                      })}
                    </div>
                  </div>

                  <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                    {selectedAdmin.username !== 'Joji' && selectedAdmin.role !== 'super_admin' ? (
                      <button 
                        type="button"
                        onClick={() => handleDeleteAdmin(selectedAdmin.id)}
                        class="px-3.5 py-2 text-xs font-bold text-rose-600 hover:bg-rose-50 rounded-xl transition cursor-pointer"
                      >
                        Adminni O'chirish
                      </button>
                    ) : (
                      <div class="text-[11px] text-slate-400 italic">Asosiy admin o'chirilmaydi</div>
                    )}

                    <div class="flex items-center gap-2">
                      <button 
                        type="button"
                        onClick={() => setShowPermsModal(false)}
                        class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl cursor-pointer"
                      >
                        Bekor qilish
                      </button>
                      <button 
                        type="submit"
                        class="px-6 py-2.5 text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 rounded-xl shadow-md transition cursor-pointer"
                      >
                        Saqlash
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Foydalanuvchi Parolini O'zgartirish Modali */}
          {passwordModalUser && (
            <div 
              class="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto"
              onClick={(e) => {
                if (e.target === e.currentTarget) setPasswordModalUser(null);
              }}
            >
              <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-5 animate-in fade-in zoom-in-95 duration-200 relative z-[101]">
                <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl font-bold">
                      🔑
                    </div>
                    <div>
                      <h3 class="text-lg font-bold text-slate-900">Parolni O'zgartirish</h3>
                      <p class="text-xs text-slate-400">
                        Foydalanuvchi: <span class="font-bold text-slate-800">{passwordModalUser.name}</span> (@{passwordModalUser.username})
                      </p>
                    </div>
                  </div>
                  <button 
                    type="button"
                    onClick={() => setPasswordModalUser(null)} 
                    class="text-slate-400 hover:text-slate-600 text-sm font-bold p-1 cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveUserPassword} class="space-y-4">
                  <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl flex items-center justify-between text-xs">
                    <span class="text-slate-500 font-medium">Joriy parol holati:</span>
                    <span class="font-mono font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-xl border border-emerald-200 inline-flex items-center gap-1">
                      <span>🔒</span>
                      <span>Supabase Auth boshqaradi</span>
                    </span>
                  </div>

                  <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                      Yangi Parol
                    </label>
                    <div class="relative">
                      <input
                        type={showNewPassword ? 'text' : 'password'}
                        value={newPasswordInput}
                        onChange={(e) => setNewPasswordInput(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            e.preventDefault();
                            handleSaveUserPassword(e);
                          }
                        }}
                        placeholder="Yangi parolni kiriting..."
                        class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 font-mono focus:outline-none focus:border-amber-500 pr-10"
                        autoFocus
                      />
                      <button
                        type="button"
                        onClick={() => setShowNewPassword(p => !p)}
                        class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-xs cursor-pointer"
                      >
                        {showNewPassword ? '🙈' : '👁️'}
                      </button>
                    </div>
                  </div>

                  <div class="flex items-center justify-between flex-wrap gap-2">
                    <button
                      type="button"
                      onClick={() => {
                        const rand = 'Ingly_' + Math.floor(1000 + Math.random() * 9000);
                        setNewPasswordInput(rand);
                        setShowNewPassword(true);
                      }}
                      class="text-xs text-amber-700 hover:text-amber-900 font-bold flex items-center gap-1 cursor-pointer bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-lg transition"
                    >
                      <span>🎲</span>
                      <span>Tasodifiy parol generatsiya qilish</span>
                    </button>
                    <span class="text-[11px] text-slate-400">Kamida 4 belgi</span>
                  </div>

                  <div class="bg-amber-50 rounded-2xl p-3.5 border border-amber-200/80 text-xs text-amber-800 space-y-1">
                    <div class="font-bold flex items-center gap-1">
                      <span>ℹ️</span>
                      <span>Eslatma:</span>
                    </div>
                    <p class="text-amber-700 leading-relaxed text-[11px]">
                      Yangi parol saqlanishi bilanoq foydalanuvchi mobil ilovaga aynan shu yangi parol orqali kiradi. Enter tugmasini bosib ham saqlashingiz mumkin.
                    </p>
                  </div>

                  <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setPasswordModalUser(null)}
                      class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition cursor-pointer"
                    >
                      Bekor qilish
                    </button>
                    <button
                      type="button"
                      onClick={handleSaveUserPassword}
                      disabled={isSavingPassword}
                      class="px-5 py-2.5 bg-amber-600 hover:bg-amber-700 disabled:opacity-50 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm cursor-pointer"
                    >
                      {isSavingPassword ? (
                        <span>Saqlanmoqda...</span>
                      ) : (
                        <>
                          <span>💾</span>
                          <span>Parolni Saqlash</span>
                        </>
                      )}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Foydalanuvchiga VIP / Premium Berish Modali */}
          {vipModalUser && (
            <div 
              class="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto"
              onClick={(e) => {
                if (e.target === e.currentTarget) setVipModalUser(null);
              }}
            >
              <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-amber-200/80 space-y-5 animate-in fade-in zoom-in-95 duration-200 relative z-[101]">
                <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                  <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-400 text-white flex items-center justify-center text-xl font-bold shadow-md shadow-amber-500/20">
                      👑
                    </div>
                    <div>
                      <h3 class="text-lg font-black text-slate-900">VIP / Premium Boshqaruvi</h3>
                      <p class="text-xs text-slate-500">
                        Foydalanuvchi: <span class="font-bold text-slate-800">{vipModalUser.name}</span> (@{vipModalUser.username})
                      </p>
                    </div>
                  </div>
                  <button 
                    type="button"
                    onClick={() => setVipModalUser(null)} 
                    class="text-slate-400 hover:text-slate-600 text-sm font-bold p-1 cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                {/* Joriy VIP holati */}
                <div class={`p-4 rounded-2xl border ${
                  vipModalUser.isVip 
                    ? 'bg-amber-50/70 border-amber-200 text-amber-900' 
                    : 'bg-slate-50 border-slate-200 text-slate-700'
                }`}>
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-600">Joriy Obuna Holati:</span>
                    <span class={`text-xs font-black px-2.5 py-1 rounded-full inline-flex items-center gap-1 ${
                      vipModalUser.isVip 
                        ? 'bg-amber-500 text-white shadow-xs' 
                        : 'bg-slate-200 text-slate-600'
                    }`}>
                      <span>{vipModalUser.isVip ? '👑 VIP FAOL' : '⚪ Oddiy (Bepul)'}</span>
                    </span>
                  </div>
                  {vipModalUser.isVip && (
                    <div class="mt-2.5 pt-2.5 border-t border-amber-200/60 text-xs flex items-center justify-between text-amber-800">
                      <span>Tugash muddati:</span>
                      <span class="font-mono font-bold">
                        {vipModalUser.premiumUntil 
                          ? new Date(vipModalUser.premiumUntil).toLocaleDateString('uz-UZ', { year: 'numeric', month: 'long', day: 'numeric' })
                          : 'Doimiy (Cheksiz)'}
                      </span>
                    </div>
                  )}
                </div>

                {/* VIP Muddati Tanlash */}
                <div class="space-y-2.5">
                  <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">
                    VIP Muddati / Ta'rifi:
                  </label>
                  <div class="grid grid-cols-2 gap-2">
                    {[
                      { days: 30, title: '1 Oy', desc: '30 kunlik', badge: 'Standart', icon: '⚡' },
                      { days: 90, title: '3 Oy', desc: '90 kunlik', badge: 'Tavsiya', icon: '🌟' },
                      { days: 365, title: '1 Yil', desc: '365 kunlik', badge: 'Katta sovg\'a', icon: '🏆' },
                      { days: 'lifetime', title: 'Umrbod', desc: 'Cheksiz VIP', badge: 'Doimiy', icon: '💎' },
                    ].map(opt => (
                      <button
                        type="button"
                        key={opt.days}
                        onClick={() => setVipDurationDays(opt.days)}
                        class={`p-3 rounded-2xl border text-left transition flex flex-col justify-between cursor-pointer ${
                          vipDurationDays === opt.days 
                            ? 'border-amber-500 bg-amber-50/50 shadow-sm ring-1 ring-amber-300' 
                            : 'border-slate-200 hover:border-slate-300 bg-white'
                        }`}
                      >
                        <div class="flex items-center justify-between w-full mb-1">
                          <span class="text-base">{opt.icon}</span>
                          <span class={`text-[10px] font-extrabold px-1.5 py-0.5 rounded-md ${
                            vipDurationDays === opt.days ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-500'
                          }`}>
                            {opt.badge}
                          </span>
                        </div>
                        <div>
                          <div class="font-black text-slate-900 text-sm">{opt.title}</div>
                          <div class="text-[11px] text-slate-500">{opt.desc}</div>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                <div class="text-[11px] text-slate-500 bg-blue-50/70 p-3 rounded-2xl border border-blue-200/80 flex items-start gap-2">
                  <span class="text-base leading-none">💡</span>
                  <span>
                    VIP berilishi bilan foydalanuvchining mobil ilovasida barcha 6 ta kitob, testlar, audio va so'zlar to'liq ochiladi.
                  </span>
                </div>

                {/* Tugmalar */}
                <div class="flex flex-col gap-2 pt-2 border-t border-slate-100">
                  <div class="flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setVipModalUser(null)}
                      class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:bg-slate-50 transition cursor-pointer"
                    >
                      Yopish
                    </button>
                    <button
                      type="button"
                      onClick={() => handleSaveUserVip(vipDurationDays)}
                      disabled={isSavingVip}
                      class="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 disabled:opacity-50 text-white rounded-xl text-xs font-black transition flex items-center gap-1.5 shadow-md shadow-amber-500/20 cursor-pointer"
                    >
                      {isSavingVip ? (
                        <span>Saqlanmoqda...</span>
                      ) : (
                        <>
                          <span>👑</span>
                          <span>VIP / Premium Berish</span>
                        </>
                      )}
                    </button>
                  </div>

                  {vipModalUser.isVip && (
                    <button
                      type="button"
                      onClick={() => {
                        if (confirm(`Rostdan ham "${vipModalUser.name}" ning VIP obunasini bekor qilmoqchimisiz?`)) {
                          handleSaveUserVip(0);
                        }
                      }}
                      disabled={isSavingVip}
                      class="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 cursor-pointer"
                    >
                      <span>🚫</span>
                      <span>VIP Obunani Bekor Qilish (Olib tashlash)</span>
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
