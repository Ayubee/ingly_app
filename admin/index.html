<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingly - Web Admin Panel</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              500: '#6366F1',
              600: '#5B4DFF',
              700: '#4338CA',
            },
            accent: {
              400: '#38BDF8',
              500: '#0EA5E9',
            },
            state: {
              mastered: '#22C55E',
              review: '#0EA5E9',
              hard: '#EF4444',
              streak: '#F97316'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
    .squircle { border-radius: 24px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Admin Xavfsizlik va Autentifikatsiya (Login: Joji, Parol: Ayubxon_2021213)
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
        return localStorage.getItem('ingly_admin_auth') === 'true' || sessionStorage.getItem('ingly_admin_auth') === 'true';
      });
      const [adminLoginInput, setAdminLoginInput] = useState('');
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [authError, setAuthError] = useState('');
      const [showPassword, setShowPassword] = useState(false);

      const handleAdminLogin = (e) => {
        if (e) e.preventDefault();
        const cleanLogin = adminLoginInput.trim();
        const cleanPass = adminPasswordInput.trim();

        if (cleanLogin === 'Joji' && cleanPass === 'Ayubxon_2021213') {
          localStorage.setItem('ingly_admin_auth', 'true');
          localStorage.setItem('ingly_admin_user', 'Joji');
          sessionStorage.setItem('ingly_admin_auth', 'true');
          setIsAdminLoggedIn(true);
          setAuthError('');
          showToast('Xush kelibsiz, Joji (Super Admin)!');
        } else {
          setAuthError('Login yoki parol noto\'g\'ri! Ruxsat etilmadi.');
        }
      };

      const handleAdminLogout = () => {
        localStorage.removeItem('ingly_admin_auth');
        localStorage.removeItem('ingly_admin_user');
        sessionStorage.removeItem('ingly_admin_auth');
        sessionStorage.removeItem('ingly_admin_user');
        setIsAdminLoggedIn(false);
        setAdminLoginInput('');
        setAdminPasswordInput('');
        setAuthError('');
      };

      const [tab, setTab] = useState('dashboard');
      const [adsEnabled, setAdsEnabled] = useState(() => {
        const saved = localStorage.getItem('ingly_ads_enabled');
        return saved !== null ? JSON.parse(saved) : false;
      });
      const [vipEnabled, setVipEnabled] = useState(() => {
        const saved = localStorage.getItem('ingly_vip_enabled');
        return saved !== null ? JSON.parse(saved) : false;
      });
      const [freeBooks, setFreeBooks] = useState(() => {
        const saved = localStorage.getItem('ingly_free_books');
        return saved !== null ? Number(saved) : 6;
      });
      const [selectedMovie, setSelectedMovie] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [activeBook, setActiveBook] = useState(1);
      const [toast, setToast] = useState('');

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };

      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('ingly_users');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return [
          { id: 1, name: 'Anvar Karimov', phone: '+998 90 123 45 67', username: 'anvar_k', words: 420, streak: 14, isBlocked: false, isVip: false },
          { id: 2, name: 'Dilnoza Rahimova', phone: '+998 93 987 65 43', username: 'dilnoza_r', words: 890, streak: 28, isBlocked: false, isVip: true },
          { id: 3, name: 'Jasur Bekmirzayev', phone: '+998 97 555 44 33', username: 'jasur_pro', words: 120, streak: 3, isBlocked: true, isVip: false },
          { id: 4, name: 'Madina Umarova', phone: '+998 91 333 22 11', username: 'madina_u', words: 640, streak: 21, isBlocked: false, isVip: false }
        ];
      });

      const [allWords, setAllWords] = useState([]);
      const [selectedBook, setSelectedBook] = useState(1);
      const [selectedUnit, setSelectedUnit] = useState('all');
      const [page, setPage] = useState(1);
      const pageSize = 20;

      // Word Modal (Add / Edit) State
      const [showWordModal, setShowWordModal] = useState(false);
      const [editingWord, setEditingWord] = useState(null);
      const [wordForm, setWordForm] = useState({
        word: '',
        phonetic: '',
        pos: 'noun',
        uzbek: '',
        definition: '',
        definition_uz: '',
        example: '',
        example_uz: '',
        book: 1,
        unit: 1,
        video_clip_url: ''
      });

      // Admins & Permissions State
      const ALL_PERMISSIONS = [
        { id: 'manage_words', label: 'So\'zlarni tahrirlash va qo\'shish', desc: '4000 ta so\'z bazasini boshqarish' },
        { id: 'manage_users', label: 'Foydalanuvchilarni boshqarish', desc: 'Foydalanuvchilarni ko\'rish, bloklash va ochish' },
        { id: 'manage_settings', label: 'Monetizatsiya va Sozlamalar', desc: 'AdMob reklama, VIP obuna va kalitlarni sozlash' },
        { id: 'manage_admins', label: 'Adminlarni boshqarish (RBAC)', desc: 'Yangi adminlar tayinlash va huquq berish' },
        { id: 'all', label: 'Barcha Huquqlar (Cheklovlarsiz)', desc: 'Tizim bo\'yicha to\'liq Super Admin huquqi' }
      ];

      const ROLE_LABELS = {
        super_admin: 'Super Admin',
        editor: 'Kontent Menejer',
        moderator: 'Moderator'
      };

      const [adminList, setAdminList] = useState(() => {
        const saved = localStorage.getItem('ingly_admin_list');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return [
          { id: 1, name: 'Boshqaruvchi (Asosiy)', username: 'Joji', role: 'super_admin', roleLabel: 'Super Admin', perms: ['all', 'manage_words', 'manage_users', 'manage_admins', 'manage_settings'], isActive: true },
          { id: 2, name: 'Otabek Mirzayev', username: 'otabek_moderator', role: 'moderator', roleLabel: 'Moderator', perms: ['manage_users'], isActive: true },
          { id: 3, name: 'Malika Karimova', username: 'malika_editor', role: 'editor', roleLabel: 'Kontent Menejer', perms: ['manage_words'], isActive: true }
        ];
      });

      const [showAdminModal, setShowAdminModal] = useState(false);
      const [showPermsModal, setShowPermsModal] = useState(false);
      const [selectedAdmin, setSelectedAdmin] = useState(null);
      const [adminForm, setAdminForm] = useState({
        name: '',
        username: '',
        password: '',
        role: 'editor',
        perms: ['manage_words']
      });

      const LIVE_SUPABASE_URL = 'https://lbsqxownrjfmjoojdsfk.supabase.co';
      const LIVE_SUPABASE_KEY = 'sb_publishable_Kbpya9vZpqll4KuUXQrpHQ_Tq3qcZ1W';

      const [supabaseUrl, setSupabaseUrl] = useState(() => localStorage.getItem('ingly_supabase_url') || LIVE_SUPABASE_URL);
      const [supabaseKey, setSupabaseKey] = useState(() => localStorage.getItem('ingly_supabase_key') || LIVE_SUPABASE_KEY);
      const [supabaseConnected, setSupabaseConnected] = useState(false);
      const [showSupabaseModal, setShowSupabaseModal] = useState(false);
      const [supabaseClient, setSupabaseClient] = useState(null);

      // Foydalanuvchilar ro'yxatini Supabase'dan yuklash
      const loadUsersFromSupabase = async (customClient = null) => {
        const client = customClient || supabaseClient;
        if (!client) return;
        try {
          const { data: statsData, error: statsErr } = await client.from('v_user_stats').select('*');
          if (!statsErr && Array.isArray(statsData) && statsData.length > 0) {
            const mapped = statsData.map(u => ({
              id: u.user_id,
              name: u.full_name || 'Noma\'lum',
              phone: u.phone || '-',
              username: u.username || 'user',
              words: Number(u.mastered_words_count) || 0,
              streak: Number(u.current_streak) || 0,
              isBlocked: !!u.is_blocked,
              isVip: !!u.is_premium
            }));
            setUsers(mapped);
            localStorage.setItem('ingly_users', JSON.stringify(mapped));
            return;
          }

          const { data, error } = await client.from('users').select('*').order('created_at', { ascending: false });
          if (!error && Array.isArray(data) && data.length > 0) {
            const mapped = data.map(u => ({
              id: u.id,
              name: u.full_name || 'Noma\'lum',
              phone: u.phone || '-',
              username: u.username || 'user',
              words: u.total_words_learned || 0,
              streak: u.current_streak || 0,
              isBlocked: !!u.is_blocked,
              isVip: !!u.is_premium
            }));
            setUsers(mapped);
            localStorage.setItem('ingly_users', JSON.stringify(mapped));
          }
        } catch (e) {
          console.warn('loadUsersFromSupabase xatosi:', e);
        }
      };

      const initSupabaseConnection = (url, key) => {
        if (!url || !key) return;
        try {
          if (window.supabase) {
            const client = window.supabase.createClient(url, key);
            setSupabaseClient(client);

            // 1. App settings ni o'qish (ads, vip, free books)
            client.from('app_settings').select('*').then(({ data, error }) => {
              if (!error && Array.isArray(data)) {
                setSupabaseConnected(true);
                data.forEach(item => {
                  if (item.setting_key === 'ads_enabled') {
                    const val = item.setting_value === true || item.setting_value === 'true';
                    setAdsEnabled(val);
                    localStorage.setItem('ingly_ads_enabled', JSON.stringify(val));
                  } else if (item.setting_key === 'premium_mode_enabled') {
                    const val = item.setting_value === true || item.setting_value === 'true';
                    setVipEnabled(val);
                    localStorage.setItem('ingly_vip_enabled', JSON.stringify(val));
                  } else if (item.setting_key === 'free_books_count') {
                    const val = Number(item.setting_value) || 6;
                    setFreeBooks(val);
                    localStorage.setItem('ingly_free_books', String(val));
                  }
                });
                showToast('Supabase sozlamalari yuklandi!');
              } else {
                setSupabaseConnected(false);
                console.warn('Supabase app_settings fetch xatosi:', error);
              }
            });

            // 2. Foydalanuvchilar ro'yxatini yuklash
            loadUsersFromSupabase(client);

            // 3. Supabase Realtime: Foydalanuvchi ro'yxatdan o'tganda avtomatik yangilash
            try {
              client.channel('realtime_users_listener')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, () => {
                  loadUsersFromSupabase(client);
                })
                .subscribe();
            } catch (e) {}
          }
        } catch (e) {
          console.error('Supabase init xatosi:', e);
        }
      };

      useEffect(() => {
        if (supabaseUrl && supabaseKey) {
          initSupabaseConnection(supabaseUrl, supabaseKey);
        }
      }, []);

      useEffect(() => {
        fetch('./all_words.json')
          .then(r => r.json())
          .then(data => {
            // LocalStorage'dagi maxsus tahrirlangan so'zlarni birlashtirish
            const customWordsStr = localStorage.getItem('ingly_custom_words');
            let merged = data;
            if (customWordsStr) {
              try {
                const customWords = JSON.parse(customWordsStr);
                const customMap = new Map(customWords.map(w => [w.id, w]));
                merged = data.map(w => customMap.get(w.id) || w);
                // Agar yangi qo'shilgan so'zlar bo'lsa
                customWords.forEach(cw => {
                  if (!merged.some(w => w.id === cw.id)) {
                    merged.unshift(cw);
                  }
                });
              } catch (e) {}
            }
            setAllWords(merged);
            showToast(`Muvaffaqiyatli: ${merged.length} ta so'z yuklandi!`);
          })
          .catch(err => {
            console.error('So\'zlar yuklanmadi:', err);
          });
      }, []);

      const speakWord = (text) => {
        if ('speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
        }
      };

      // Reklama switchi
      const handleToggleAds = async () => {
        const newVal = !adsEnabled;
        setAdsEnabled(newVal);
        localStorage.setItem('ingly_ads_enabled', JSON.stringify(newVal));
        showToast(`Reklama: ${newVal ? 'YOQILDI' : 'O\'CHIRILDI'}`);

        if (supabaseClient) {
          try {
            await supabaseClient.from('app_settings').upsert({
              setting_key: 'ads_enabled',
              setting_value: newVal,
              description: 'Google AdMob reklamalarini ilovada ko\'rsatish.'
            }, { onConflict: 'setting_key' });
          } catch (e) {
            console.warn('Supabase ads save error:', e);
          }
        }
      };

      // VIP obuna switchi
      const handleToggleVip = async () => {
        const newVal = !vipEnabled;
        setVipEnabled(newVal);
        localStorage.setItem('ingly_vip_enabled', JSON.stringify(newVal));
        showToast(`VIP rejim: ${newVal ? 'YOQILDI' : 'O\'CHIRILDI'}`);

        if (supabaseClient) {
          try {
            await supabaseClient.from('app_settings').upsert({
              setting_key: 'premium_mode_enabled',
              setting_value: newVal,
              description: 'Pullik obuna (Premium) rejimini yoqish/o\'chirish.'
            }, { onConflict: 'setting_key' });
          } catch (e) {
            console.warn('Supabase vip save error:', e);
          }
        }
      };

      // Bepul kitoblar soni
      const handleSetFreeBooks = async (num) => {
        setFreeBooks(num);
        localStorage.setItem('ingly_free_books', String(num));
        showToast(`Bepul kitoblar: ${num} ta etib belgilandi`);

        if (supabaseClient) {
          try {
            await supabaseClient.from('app_settings').upsert({
              setting_key: 'free_books_count',
              setting_value: num,
              description: 'Foydalanuvchilarga bepul beriladigan kitoblar soni.'
            }, { onConflict: 'setting_key' });
          } catch (e) {
            console.warn('Supabase free books save error:', e);
          }
        }
      };

      // Foydalanuvchini bloklash / blokdan ochish
      const toggleBlockUser = async (id) => {
        const updated = users.map(u => u.id === id ? { ...u, isBlocked: !u.isBlocked } : u);
        setUsers(updated);
        localStorage.setItem('ingly_users', JSON.stringify(updated));
        showToast('Foydalanuvchi holati yangilandi!');

        if (supabaseClient) {
          try {
            const target = updated.find(u => u.id === id);
            await supabaseClient.from('users').update({ is_blocked: target.isBlocked }).eq('id', id);
          } catch (e) {
            console.warn('Supabase block user error:', e);
          }
        }
      };

      // So'z qo'shish modalini ochish
      const openAddWordModal = () => {
        setEditingWord(null);
        setWordForm({
          word: '',
          phonetic: '',
          pos: 'noun',
          uzbek: '',
          definition: '',
          definition_uz: '',
          example: '',
          example_uz: '',
          book: selectedBook === 'all' ? 1 : Number(selectedBook),
          unit: selectedUnit === 'all' ? 1 : Number(selectedUnit),
          video_clip_url: ''
        });
        setShowWordModal(true);
      };

      // So'zni tahrirlash modalini ochish
      const openEditWordModal = (word) => {
        setEditingWord(word);
        setWordForm({
          word: word.word || '',
          phonetic: word.phonetic || word.ipa || '',
          pos: word.pos || 'noun',
          uzbek: word.uzbek || '',
          definition: word.definition || '',
          definition_uz: word.definition_uz || '',
          example: word.example || '',
          example_uz: word.example_uz || '',
          book: word.book || 1,
          unit: word.unit || 1,
          video_clip_url: word.video_clip_url || ''
        });
        setShowWordModal(true);
      };

      // So'zni saqlash (Add / Edit)
      const handleSaveWord = async (e) => {
        if (e) e.preventDefault();
        const cleanWord = wordForm.word.trim();
        const cleanUzbek = wordForm.uzbek.trim();

        if (!cleanWord || !cleanUzbek) {
          showToast('So\'z va o\'zbekcha ma\'nosini kiritish shart!');
          return;
        }

        let updatedList = [];
        let savedWordObj = null;

        if (editingWord) {
          savedWordObj = {
            ...editingWord,
            ...wordForm,
            word: cleanWord,
            uzbek: cleanUzbek,
            ipa: wordForm.phonetic || editingWord.ipa
          };
          updatedList = allWords.map(w => w.id === editingWord.id ? savedWordObj : w);
          showToast(`"${cleanWord}" so'zi muvaffaqiyatli yangilandi!`);
        } else {
          savedWordObj = {
            id: Date.now(),
            ...wordForm,
            word: cleanWord,
            uzbek: cleanUzbek,
            ipa: wordForm.phonetic,
            movie: 'Ingly HD Cinema',
            clip: `Ingly Cinema: ${cleanWord}`
          };
          updatedList = [savedWordObj, ...allWords];
          showToast(`Yangi "${cleanWord}" so'zi qo'shildi!`);
        }

        setAllWords(updatedList);
        setShowWordModal(false);

        // LocalStorage'ga yozish (sahifa yangilanganda yo'qolmasligi uchun)
        try {
          const customWordsStr = localStorage.getItem('ingly_custom_words');
          let customList = customWordsStr ? JSON.parse(customWordsStr) : [];
          if (editingWord) {
            customList = customList.map(cw => cw.id === editingWord.id ? savedWordObj : cw);
            if (!customList.some(cw => cw.id === editingWord.id)) customList.push(savedWordObj);
          } else {
            customList.unshift(savedWordObj);
          }
          localStorage.setItem('ingly_custom_words', JSON.stringify(customList));
        } catch (e) {}

        // Supabase bazasiga ham yozish
        if (supabaseClient) {
          try {
            await supabaseClient.from('words').upsert({
              word: cleanWord,
              phonetic: wordForm.phonetic || null,
              part_of_speech: wordForm.pos || 'noun',
              uzbek_translation: cleanUzbek,
              definition: wordForm.definition || 'Definition',
              definition_uz: wordForm.definition_uz || cleanUzbek,
              example: wordForm.example || 'Example sentence.',
              example_uz: wordForm.example_uz || 'Misol gap.',
              video_clip_url: wordForm.video_clip_url || null,
              unit_id: 1 // default Unit 1
            });
            showToast(`Supabase bulut bazasiga ham saqlandi!`);
          } catch (err) {
            console.warn('Supabase word upsert error:', err);
          }
        }
      };

      // So'zni o'chirish
      const handleDeleteWord = (id) => {
        if (!confirm('Haqiqatan ham ushbu so\'zni o\'chirmoqchimisiz?')) return;
        const updated = allWords.filter(w => w.id !== id);
        setAllWords(updated);
        try {
          const customWordsStr = localStorage.getItem('ingly_custom_words');
          if (customWordsStr) {
            const customList = JSON.parse(customWordsStr).filter(cw => cw.id !== id);
            localStorage.setItem('ingly_custom_words', JSON.stringify(customList));
          }
        } catch (e) {}
        showToast('So\'z o\'chirildi!');
      };

      // Admin qo'shish modalini ochish
      const openAddAdminModal = () => {
        setAdminForm({
          name: '',
          username: '',
          password: '',
          role: 'editor',
          perms: ['manage_words']
        });
        setShowAdminModal(true);
      };

      // Ruxsatlarni sozlash modalini ochish
      const openPermsModal = (admin) => {
        setSelectedAdmin({
          ...admin,
          perms: Array.isArray(admin.perms) ? [...admin.perms] : []
        });
        setShowPermsModal(true);
      };

      // Yangi adminni saqlash
      const handleSaveNewAdmin = async (e) => {
        if (e) e.preventDefault();
        const cleanName = adminForm.name.trim();
        const cleanUsername = adminForm.username.trim().toLowerCase();
        const cleanPassword = adminForm.password.trim();

        if (!cleanName || !cleanUsername || !cleanPassword) {
          showToast('Iltimos, barcha maydonlarni to\'ldiring!');
          return;
        }

        if (adminList.some(a => (a.username || '').toLowerCase() === cleanUsername)) {
          showToast(`"${cleanUsername}" logini allaqachon mavjud!`);
          return;
        }

        const newAdminObj = {
          id: Date.now(),
          name: cleanName,
          username: cleanUsername,
          role: adminForm.role,
          roleLabel: ROLE_LABELS[adminForm.role] || 'Admin',
          perms: adminForm.perms.length > 0 ? adminForm.perms : ['manage_words'],
          isActive: true
        };

        const updated = [...adminList, newAdminObj];
        setAdminList(updated);
        localStorage.setItem('ingly_admin_list', JSON.stringify(updated));
        setShowAdminModal(false);
        showToast(`Yangi admin: "${cleanUsername}" muvaffaqiyatli qo'shildi!`);

        if (supabaseClient) {
          try {
            await supabaseClient.from('admins').insert([{
              full_name: cleanName,
              username: cleanUsername,
              password_hash: cleanPassword,
              role: adminForm.role,
              permissions: newAdminObj.perms,
              is_active: true
            }]);
          } catch (err) {
            console.warn('Supabase admins insert error:', err);
          }
        }
      };

      // Ruxsatlarni va rolni yangilash
      const handleSavePermissions = async (e) => {
        if (e) e.preventDefault();
        if (!selectedAdmin) return;

        const updated = adminList.map(a => {
          if (a.id === selectedAdmin.id) {
            return {
              ...selectedAdmin,
              roleLabel: ROLE_LABELS[selectedAdmin.role] || selectedAdmin.role
            };
          }
          return a;
        });

        setAdminList(updated);
        localStorage.setItem('ingly_admin_list', JSON.stringify(updated));
        setShowPermsModal(false);
        showToast(`"${selectedAdmin.name}" uchun ruxsatlar yangilandi!`);

        if (supabaseClient) {
          try {
            await supabaseClient.from('admins').update({
              role: selectedAdmin.role,
              permissions: selectedAdmin.perms,
              is_active: selectedAdmin.isActive
            }).eq('username', selectedAdmin.username);
          } catch (err) {
            console.warn('Supabase admins update error:', err);
          }
        }
      };

      // Adminni o'chirish
      const handleDeleteAdmin = async (adminId) => {
        const target = adminList.find(a => a.id === adminId);

                    </div>
                  </div>
                  <button onClick={() => setShowAdminModal(false)} class="text-slate-400 hover:text-slate-600 text-sm font-bold p-1 cursor-pointer">✕</button>
                </div>

                <form onSubmit={handleSaveNewAdmin} class="space-y-4 text-xs">
                  {users.length > 0 && (
                    <div class="bg-purple-50/70 p-3 rounded-2xl border border-purple-100 mb-2">
                      <label class="block font-bold text-purple-900 mb-1 flex items-center gap-1.5">
                        <span>👑</span>
                        <span>Mavjud Foydalanuvchilar orasidan tanlash (Tezkor to'ldirish):</span>
                      </label>
                      <select
                        onChange={(e) => {
                          const selectedU = users.find(u => String(u.id) === e.target.value);
                          if (selectedU) {
                            setAdminForm(prev => ({
                              ...prev,
                              name: selectedU.name || '',
                              username: (selectedU.username || '').toLowerCase().replace(/\s/g, ''),
                              password: selectedU.password || 'admin123'
                            }));
                          }
                        }}
                        class="w-full border border-purple-200 rounded-xl px-3 py-2 text-xs text-slate-800 bg-white focus:outline-none focus:border-brand-500 font-medium cursor-pointer"
                      >
                        <option value="">-- Ro'yxatdan o'tgan foydalanuvchini tanlang --</option>
                        {users.map(u => (
                          <option key={u.id} value={u.id}>
                            {u.name} (@{u.username}) • {u.phone}
                          </option>
                        ))}
                      </select>
                      <p class="text-[10px] text-purple-600 mt-1">Tanlaganingizda ism, login va ma'lumotlar avtomatik to'ldiriladi.</p>
                    </div>
                  )}

                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Ism & Familiya *</label>
                    <input 
                      type="text" 
                      required 
                      placeholder="Masalan: Sardor Aliyev" 
                      value={adminForm.name}
                      onChange={(e) => setAdminForm({ ...adminForm, name: e.target.value })}
                      class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-brand-500 font-semibold"
                    />
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label class="block font-bold text-slate-700 mb-1">Login (Username) *</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="sardor_admin" 
                        value={adminForm.username}
                        onChange={(e) => setAdminForm({ ...adminForm, username: e.target.value.toLowerCase().replace(/\s/g, '') })}
                        class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-brand-500 font-mono"
                      />
                    </div>
                    <div>
                      <label class="block font-bold text-slate-700 mb-1">Parol *</label>
                      <input 
                        type="password" 
                        required 
                        placeholder="Kamida 6 ta belgi" 
                        value={adminForm.password}
                        onChange={(e) => setAdminForm({ ...adminForm, password: e.target.value })}
                        class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-brand-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Admin Roli</label>
                    <select 
                      value={adminForm.role}
                      onChange={(e) => {
                        const newRole = e.target.value;
                        let defaultPerms = ['manage_words'];
                        if (newRole === 'super_admin') defaultPerms = ['all', 'manage_words', 'manage_users', 'manage_admins', 'manage_settings'];
                        else if (newRole === 'moderator') defaultPerms = ['manage_users'];
                        setAdminForm({ ...adminForm, role: newRole, perms: defaultPerms });
                      }}
                      class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-brand-500 bg-white"
                    >
                      <option value="editor">Kontent Menejer (Faqat so'zlar)</option>
                      <option value="moderator">Moderator (Foydalanuvchilarni bloklash)</option>
                      <option value="super_admin">Super Admin (Cheklanmagan huquq)</option>
                    </select>
                  </div>

                  <div>
                    <label class="block font-bold text-slate-700 mb-2">Belgilangan Huquqlar (Ruxsatlar)</label>
                    <div class="space-y-2 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                      {ALL_PERMISSIONS.map(p => {
                        const checked = adminForm.perms.includes(p.id);
                        return (
                          <label key={p.id} class="flex items-start gap-2.5 cursor-pointer">
                            <input 
                              type="checkbox"
                              checked={checked}
                              onChange={(e) => {
                                let newPerms = [...adminForm.perms];
                                if (e.target.checked) {
                                  if (!newPerms.includes(p.id)) newPerms.push(p.id);
                                } else {
                                  newPerms = newPerms.filter(id => id !== p.id);
                                }
                                setAdminForm({ ...adminForm, perms: newPerms });
                              }}
                              class="mt-0.5 rounded text-brand-600 focus:ring-brand-500 cursor-pointer"
                            />
                            <div>
                              <div class="font-bold text-slate-800 text-xs">{p.label}</div>
                              <div class="text-[11px] text-slate-400">{p.desc}</div>
                            </div>
                          </label>
                        );
                      })}
                    </div>
                  </div>

                  <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
                    <button 
                      type="button"
                      onClick={() => setShowAdminModal(false)}
                      class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl cursor-pointer"
                    >
                      Bekor qilish
                    </button>
                    <button 
                      type="submit"
                      class="px-6 py-2.5 text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 rounded-xl shadow-md transition cursor-pointer"
                    >
                      Adminni Saqlash
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Ruxsatlarni Sozlash Modali */}
          {showPermsModal && selectedAdmin && (
            <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-5 my-8">
                <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold">
                      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                    <div>
                      <h3 class="text-lg font-bold text-slate-900">"{selectedAdmin.name}" Huquqlari</h3>
                      <p class="text-xs text-slate-400">Login: @{selectedAdmin.username}</p>
                    </div>
                  </div>
                  <button onClick={() => setShowPermsModal(false)} class="text-slate-400 hover:text-slate-600 text-sm font-bold p-1 cursor-pointer">✕</button>
                </div>

                <form onSubmit={handleSavePermissions} class="space-y-4 text-xs">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Admin Roli</label>
                    <select 
                      value={selectedAdmin.role}
                      onChange={(e) => {
                        const newRole = e.target.value;
                        let defaultPerms = selectedAdmin.perms || [];
                        if (newRole === 'super_admin' && !defaultPerms.includes('all')) {
                          defaultPerms = ['all', 'manage_words', 'manage_users', 'manage_admins', 'manage_settings'];
                        }
                        setSelectedAdmin({ ...selectedAdmin, role: newRole, perms: defaultPerms });
                      }}
                      class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-brand-500 bg-white"
                    >
                      <option value="editor">Kontent Menejer (Faqat so'zlar)</option>
                      <option value="moderator">Moderator (Foydalanuvchilarni bloklash)</option>
                      <option value="super_admin">Super Admin (Cheklanmagan huquq)</option>
                    </select>
                  </div>

                  <div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-200">
                    <div>
                      <div class="font-bold text-slate-800 text-xs">Admin Faolligi (Status)</div>
                      <div class="text-[11px] text-slate-400">O'chirilsa bu admin tizimga kira olmaydi</div>
                    </div>
                    <button
                      type="button"
                      onClick={() => setSelectedAdmin({ ...selectedAdmin, isActive: !selectedAdmin.isActive })}
                      class={`px-3 py-1.5 rounded-xl font-bold text-xs transition cursor-pointer ${selectedAdmin.isActive ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}
                    >
                      {selectedAdmin.isActive ? '✓ Faol' : '✕ Nofaol'}
                    </button>
                  </div>

                  <div>
                    <label class="block font-bold text-slate-700 mb-2">Ruxsatlar va Huquqlar (RBAC)</label>
                    <div class="space-y-2 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                      {ALL_PERMISSIONS.map(p => {
                        const permsList = Array.isArray(selectedAdmin.perms) ? selectedAdmin.perms : [];
                        const checked = permsList.includes(p.id);
                        return (
                          <label key={p.id} class="flex items-start gap-2.5 cursor-pointer">
                            <input 
                              type="checkbox"
                              checked={checked}
                              onChange={(e) => {
                                let newPerms = [...permsList];
                                if (e.target.checked) {
                                  if (!newPerms.includes(p.id)) newPerms.push(p.id);
                                } else {
                                  newPerms = newPerms.filter(id => id !== p.id);
                                }
                                setSelectedAdmin({ ...selectedAdmin, perms: newPerms });
                              }}
                              class="mt-0.5 rounded text-brand-600 focus:ring-brand-500 cursor-pointer"
                            />
                            <div>
                              <div class="font-bold text-slate-800 text-xs">{p.label}</div>
                              <div class="text-[11px] text-slate-400">{p.desc}</div>
                            </div>
                          </label>
                        );
                      })}
                    </div>
                  </div>

                  <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                    {selectedAdmin.username !== 'Joji' && selectedAdmin.role !== 'super_admin' ? (
                      <button 
                        type="button"
                        onClick={() => handleDeleteAdmin(selectedAdmin.id)}
                        class="px-3.5 py-2 text-xs font-bold text-rose-600 hover:bg-rose-50 rounded-xl transition cursor-pointer"
                      >
                        Adminni O'chirish
                      </button>
                    ) : (
                      <div class="text-[11px] text-slate-400 italic">Asosiy admin o'chirilmaydi</div>
                    )}

                    <div class="flex items-center gap-2">
                      <button 
                        type="button"
                        onClick={() => setShowPermsModal(false)}
                        class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl cursor-pointer"
                      >
                        Bekor qilish
                      </button>
                      <button 
                        type="submit"
                        class="px-6 py-2.5 text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 rounded-xl shadow-md transition cursor-pointer"
                      >
                        Saqlash
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
