<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingly - Web Admin Panel</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              500: '#6366F1',
              600: '#5B4DFF',
              700: '#4338CA',
            },
            accent: {
              400: '#38BDF8',
              500: '#0EA5E9',
            },
            state: {
              mastered: '#22C55E',
              review: '#0EA5E9',
              hard: '#EF4444',
              streak: '#F97316'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
    .squircle { border-radius: 24px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Admin Xavfsizlik va Autentifikatsiya (Login: Joji, Parol: Ayubxon_2021213)
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
        return localStorage.getItem('ingly_admin_auth') === 'true' || sessionStorage.getItem('ingly_admin_auth') === 'true';
      });
      const [adminLoginInput, setAdminLoginInput] = useState('');
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [authError, setAuthError] = useState('');
      const [showPassword, setShowPassword] = useState(false);

      const handleAdminLogin = (e) => {
        if (e) e.preventDefault();
        const cleanLogin = adminLoginInput.trim();
        const cleanPass = adminPasswordInput.trim();

        if (cleanLogin === 'Joji' && cleanPass === 'Ayubxon_2021213') {
          localStorage.setItem('ingly_admin_auth', 'true');
          localStorage.setItem('ingly_admin_user', 'Joji');
          sessionStorage.setItem('ingly_admin_auth', 'true');
          setIsAdminLoggedIn(true);
          setAuthError('');
          showToast('Xush kelibsiz, Joji (Super Admin)!');
        } else {
          setAuthError('Login yoki parol noto\'g\'ri! Ruxsat etilmadi.');
        }
      };

      const handleAdminLogout = () => {
        localStorage.removeItem('ingly_admin_auth');
        localStorage.removeItem('ingly_admin_user');
        sessionStorage.removeItem('ingly_admin_auth');
        sessionStorage.removeItem('ingly_admin_user');
        setIsAdminLoggedIn(false);
        setAdminLoginInput('');
        setAdminPasswordInput('');
        setAuthError('');
      };

      const [tab, setTab] = useState('dashboard');
      const [adsEnabled, setAdsEnabled] = useState(false);
      const [vipEnabled, setVipEnabled] = useState(false);
      const [freeBooks, setFreeBooks] = useState(6);
      const [selectedMovie, setSelectedMovie] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [activeBook, setActiveBook] = useState(1);
      const [toast, setToast] = useState('');

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };

      const [users, setUsers] = useState([
        { id: 1, name: 'Anvar Karimov', phone: '+998 90 123 45 67', username: 'anvar_k', words: 420, streak: 14, isBlocked: false, isVip: false },
        { id: 2, name: 'Dilnoza Rahimova', phone: '+998 93 987 65 43', username: 'dilnoza_r', words: 890, streak: 28, isBlocked: false, isVip: true },
        { id: 3, name: 'Jasur Bekmirzayev', phone: '+998 97 555 44 33', username: 'jasur_pro', words: 120, streak: 3, isBlocked: true, isVip: false },
        { id: 4, name: 'Madina Umarova', phone: '+998 91 333 22 11', username: 'madina_u', words: 640, streak: 21, isBlocked: false, isVip: false }
      ]);

      const [allWords, setAllWords] = useState([]);
      const [selectedBook, setSelectedBook] = useState(1);
      const [selectedUnit, setSelectedUnit] = useState('all');
      const [page, setPage] = useState(1);
      const pageSize = 20;

      const [supabaseUrl, setSupabaseUrl] = useState(() => localStorage.getItem('ingly_supabase_url') || '');
      const [supabaseKey, setSupabaseKey] = useState(() => localStorage.getItem('ingly_supabase_key') || '');
      const [supabaseConnected, setSupabaseConnected] = useState(false);
      const [showSupabaseModal, setShowSupabaseModal] = useState(false);
      const [supabaseClient, setSupabaseClient] = useState(null);

      const initSupabaseConnection = (url, key) => {
        if (!url || !key) return;
        try {
          if (window.supabase) {
            const client = window.supabase.createClient(url, key);
            setSupabaseClient(client);
            client.from('books').select('id, book_number').limit(1).then(({ data, error }) => {
              if (!error) {
                setSupabaseConnected(true);
                showToast('Supabase bazasi bilan xavfsiz ulanish faol!');
              } else {
                setSupabaseConnected(false);
                console.warn('Supabase test ulanish xatosi:', error);
              }
            });
          }
        } catch (e) {
          console.error('Supabase init xatosi:', e);
        }
      };

      useEffect(() => {
        if (supabaseUrl && supabaseKey) {
          initSupabaseConnection(supabaseUrl, supabaseKey);
        }
      }, []);

      useEffect(() => {
        fetch('./all_words.json')
          .then(r => r.json())
          .then(data => {
            setAllWords(data);
            showToast(`Muvaffaqiyatli: ${data.length} ta so'z yuklandi!`);
          })
          .catch(err => {
            console.error('So\'zlar yuklanmadi:', err);
          });
      }, []);

      const speakWord = (text) => {
        if ('speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
        }
      };

      const toggleBlockUser = (id) => {
        setUsers(users.map(u => u.id === id ? { ...u, isBlocked: !u.isBlocked } : u));
        showToast('Foydalanuvchi holati yangilandi!');
      };

      if (!isAdminLoggedIn) {
        return (
          <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden font-sans">
            {/* Background glowing ambient effects */}
            <div class="absolute -top-40 -left-40 w-96 h-96 bg-brand-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-accent-500/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="w-full max-w-md bg-slate-800/90 backdrop-blur-xl border border-slate-700/80 rounded-3xl p-8 shadow-2xl relative z-10">
              {/* Brand Header */}
              <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto mb-4 squircle bg-gradient-to-tr from-brand-600 to-accent-400 flex items-center justify-center shadow-xl shadow-brand-500/30 text-white">
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                  </svg>
                </div>
                <h1 class="text-2xl font-black tracking-tight text-white">Ingly Admin Panel</h1>
                <p class="text-xs text-slate-400 mt-1 font-medium">Boshqaruv tizimiga kirish uchun ma'lumotlarni kiriting</p>
              </div>

              {/* Error Message */}
              {authError && (
                <div class="mb-6 p-3.5 bg-rose-500/10 border border-rose-500/30 rounded-2xl flex items-center gap-3 text-rose-400 text-xs font-semibold animate-shake">
                  <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                  <span>{authError}</span>
                </div>
              )}

              {/* Login Form */}
              <form onSubmit={handleAdminLogin} class="space-y-4">
                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Admin Logini</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </div>
                    <input 
                      type="text" 
                      required
                      value={adminLoginInput}
                      onChange={(e) => setAdminLoginInput(e.target.value)}
                      placeholder="Loginni kiriting"
                      class="w-full bg-slate-900/80 border border-slate-700 rounded-2xl pl-10 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all"
                    />
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">Maxfiy Parol</label>
                  <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                    <input 
                      type={showPassword ? 'text' : 'password'}
                      required
                      value={adminPasswordInput}
                      onChange={(e) => setAdminPasswordInput(e.target.value)}
                      placeholder="Parolni kiriting"
                      class="w-full bg-slate-900/80 border border-slate-700 rounded-2xl pl-10 pr-12 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 transition-all"
                    />
                    <button 
                      type="button" 
                      onClick={() => setShowPassword(!showPassword)}
                      class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition"
                    >
                      {showPassword ? (
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
                      ) : (
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                      )}
                    </button>
                  </div>
                </div>

                <button 
                  type="submit" 
                  class="w-full mt-2 bg-gradient-to-r from-brand-600 to-accent-500 hover:from-brand-500 hover:to-accent-400 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-brand-500/25 active:scale-[0.99] transition-all flex items-center justify-center gap-2 cursor-pointer"
                >
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
                  <span>Tizimga Kirish</span>
                </button>
              </form>

              <div class="mt-6 pt-6 border-t border-slate-700/60 text-center">
                <p class="text-[11px] text-slate-400 flex items-center justify-center gap-1.5 font-medium">
                  <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                  Xavfsiz zona: 256-bit Shifrlangan Ulanish
                </p>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div class="flex min-h-screen">
          {/* Toast Notification */}
          {toast && (
            <div class="fixed top-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-slate-700 animate-bounce">
              <span class="w-2.5 h-2.5 rounded-full bg-state-mastered"></span>
              <span class="text-sm font-semibold">{toast}</span>
            </div>
          )}

          {/* SIDEBAR */}
          <aside class="w-72 bg-white border-r border-slate-200/80 flex flex-col justify-between p-6 shrink-0">
            <div>
              {/* Brand Logo */}
              <div class="flex items-center gap-3.5 mb-10 px-2">
                <div class="w-12 h-12 squircle bg-gradient-to-tr from-brand-600 to-accent-400 flex items-center justify-center shadow-lg shadow-brand-500/25 text-white">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                </div>
                <div>
                  <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-brand-600 to-accent-500 bg-clip-text text-transparent">Ingly</h1>
                  <p class="text-xs font-semibold text-slate-400">Admin Boshqaruv v1.0</p>
                </div>
              </div>

              {/* Navigation Menu */}
              <nav class="space-y-1.5">
                {[
                  { id: 'dashboard', label: 'Bosh Sahifa', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
                  { id: 'words', label: "So'zlar Bazasi (4000)", icon: 'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253' },
                  { id: 'users', label: 'Foydalanuvchilar', icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z' },
                  { id: 'monetization', label: 'Monetizatsiya & Reklama', icon: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z' },
                  { id: 'admins', label: 'Adminlar & Huquqlar', icon: 'M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z' },
                  { id: 'notifications', label: 'Push Xabarnomalar', icon: 'M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    class={`w-full flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold transition-all ${
                      tab === item.id 
                        ? 'bg-brand-50 text-brand-600 shadow-sm border border-brand-100' 
                        : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                    }`}
                  >
                    <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d={item.icon}/></svg>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            {/* Supabase status badge */}
            <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4">
              <div class="flex items-center justify-between mb-1.5">
                <div class="flex items-center gap-2">
                  <span class={`w-2.5 h-2.5 rounded-full ${supabaseConnected ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                  <span class="text-xs font-bold text-slate-700">
                    {supabaseConnected ? 'Supabase: Jonli Ulanish' : 'Supabase: Lokal/Kesh'}
                  </span>
                </div>
              </div>
              <p class="text-[11px] text-slate-500 leading-tight mb-3">
                {supabaseConnected 
                  ? 'PostgreSQL bulut bazasi bilan sinxron.' 
                  : 'Bulut bazasi ulanishini sozlash uchun bosing.'}
              </p>
              <button 
                onClick={() => setShowSupabaseModal(true)}
                class="w-full text-xs font-bold py-2 px-3 bg-white border border-slate-200 hover:border-brand-500 text-brand-600 rounded-xl transition shadow-xs flex items-center justify-center gap-1.5 cursor-pointer"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span>{supabaseConnected ? 'Ulanishni ko\'rish' : 'Supabase\'ni ulash'}</span>
              </button>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main class="flex-1 flex flex-col min-w-0">
            {/* TOP HEADER */}
            <header class="h-20 bg-white border-b border-slate-200/80 px-8 flex items-center justify-between sticky top-0 z-30">
              <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                  <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                  100% Bepul & Reklamasiz Rejim
                </span>
                <span class="text-xs text-slate-400">|</span>
                <span class="text-xs text-slate-500 font-medium">Baza: 4000 Essential English Words</span>
              </div>

              {/* Super Admin Profile & Logout */}
              <div class="flex items-center gap-3">
                <div class="text-right">
                  <div class="text-sm font-bold text-slate-800 flex items-center justify-end gap-1.5">
                    <span>Joji</span>
                    <span class="px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wide bg-brand-100 text-brand-700 rounded-full">Super Admin</span>
                  </div>
                  <div class="text-[11px] font-medium text-slate-400">admin@ingly.uz</div>
                </div>
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-brand-600 to-accent-500 text-white font-bold flex items-center justify-center ring-4 ring-brand-50 shadow-sm">
                  J
                </div>
                <button

                      </div>
                    </div>

                    {/* VIP Subscription Switch */}
                    <div class="border border-slate-200 rounded-3xl p-6 space-y-4">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                          <span class="text-3xl">👑</span>
                          <div>
                            <h4 class="font-bold text-slate-900">Ingly VIP / Premium Obunasi</h4>
                            <p class="text-xs text-slate-400">Pullik rejim va kitoblarni yopish</p>
                          </div>
                        </div>
                        <button
                          onClick={() => { setVipEnabled(!vipEnabled); showToast(`VIP rejim: ${!vipEnabled ? 'YOQILDI' : 'O\'CHIRILDI'}`); }}
                          class={`w-14 h-8 rounded-full transition-colors relative ${vipEnabled ? 'bg-emerald-500' : 'bg-slate-300'}`}
                        >
                          <span class={`w-6 h-6 bg-white rounded-full absolute top-1 transition-transform ${vipEnabled ? 'left-7' : 'left-1'}`}></span>
                        </button>
                      </div>
                      <div class={`text-xs font-bold px-3 py-2 rounded-xl ${vipEnabled ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'}`}>
                        Holat: {vipEnabled ? 'Pullik obuna tizimi yoqildi' : 'Hamma 6 ta kitob mutlaqo bepul (O\'chiq)'}
                      </div>
                    </div>
                  </div>

                  {/* Free Books Selector */}
                  <div class="border border-slate-200 rounded-3xl p-6 space-y-3">
                    <h4 class="font-bold text-slate-900 text-sm">Hamma uchun Ochiq (Bepul) Kitoblar Soni</h4>
                    <p class="text-xs text-slate-400">Agar obuna yoqilsa, qaysi kitoblar bepul bo'lishini belgilang:</p>
                    <div class="flex gap-3">
                      {[1, 2, 3, 4, 5, 6].map(num => (
                        <button
                          key={num}
                          onClick={() => { setFreeBooks(num); showToast(`Bepul kitoblar: ${num} ta etib belgilandi`); }}
                          class={`px-4 py-2 rounded-xl text-xs font-bold transition ${freeBooks === num ? 'bg-brand-600 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                        >
                          {num} ta kitob bepul
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* 5. ADMINS TAB */}
              {tab === 'admins' && (
                <div class="bg-white rounded-3xl p-8 border border-slate-200/80 shadow-sm space-y-6">
                  <div class="flex items-center justify-between">
                    <div>
                      <h2 class="text-2xl font-extrabold text-slate-900">Adminlar va Huquqlar Boshqaruvi (RBAC)</h2>
                      <p class="text-sm text-slate-500">Yangi admin qo'shish, o'chirish va ularning ruxsatlarini cheklash</p>
                    </div>
                    <button onClick={() => showToast('Yangi admin qo\'shish modali ochildi')} class="bg-brand-600 text-white font-bold text-sm px-4 py-2 rounded-xl shadow hover:bg-brand-700 transition">
                      + Yangi Admin
                    </button>
                  </div>

                  <div class="space-y-4">
                    {[
                      { name: 'Boshqaruvchi (Asosiy)', username: 'admin', role: 'Super Admin', perms: ['Barcha huquqlar', 'So\'zlarni tahrirlash', 'Foydalanuvchilarni bloklash', 'Adminlarni boshqarish'] },
                      { name: 'Otabek Mirzayev', username: 'otabek_moderator', role: 'Moderator', perms: ['Foydalanuvchilarni ko\'rish', 'Bloklash/Ochish'] },
                      { name: 'Malika Karimova', username: 'malika_editor', role: 'Kontent Menejer', perms: ['So\'zlar va tarjimalarni kiritish'] }
                    ].map((a, i) => (
                      <div key={i} class="border border-slate-200 rounded-2xl p-5 flex items-center justify-between hover:border-brand-500/40 transition">
                        <div>
                          <div class="flex items-center gap-3 mb-1">
                            <span class="font-bold text-slate-900">{a.name}</span>
                            <span class="text-xs font-mono text-slate-400">(@{a.username})</span>
                            <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-brand-50 text-brand-600">{a.role}</span>
                          </div>
                          <div class="flex flex-wrap gap-1.5 mt-2">
                            {a.perms.map((p, pi) => (
                              <span key={pi} class="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-medium">✓ {p}</span>
                            ))}
                          </div>
                        </div>
                        <button onClick={() => showToast('Ruxsatlar sozlamasi ochildi')} class="text-xs font-bold text-slate-500 hover:text-brand-600 border border-slate-200 px-3 py-1.5 rounded-xl hover:bg-slate-50 transition">
                          Ruxsatlarni Sozlash
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 6. NOTIFICATIONS TAB */}
              {tab === 'notifications' && (
                <div class="bg-white rounded-3xl p-8 border border-slate-200/80 shadow-sm space-y-6">
                  <div>
                    <h2 class="text-2xl font-extrabold text-slate-900">Kreativ Push Bildirishnomalar</h2>
                    <p class="text-sm text-slate-500">Standart zerikarli eslatmalardan qochilgan do'stona xabarlarni bitta bosishda yuborish</p>
                  </div>

                  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
                    {/* Templates list */}
                    <div class="space-y-3">
                      <h4 class="font-bold text-slate-800 text-sm mb-2">Tayyor Kreativ Shablonlar:</h4>
                      {[
                        { title: 'Olovcha Eslatmasi 🔥', msg: '7 kunlik streak\'ingiz o\'chib qolmasin! 5 ta so\'z yodlang va olovni saqlang.' },
                        { title: 'Qahva va So\'zlar ☕', msg: 'Qahvangiz sovumasidan oldin bugungi 5 ta yangi so\'z bilan tanishib olaylikmi?' },
                        { title: 'Zerikkan So\'zlar 👀', msg: 'Bugungi so\'zlaringiz sizni kuta-kuta zerikib qoldi. 3 daqiqa vaqt ajrata olasizmi?' },
                        { title: 'Yangi Unit 🧠', msg: 'Bugun ingliz tilida o\'ylash vaqti keldi! Yangi dars eshikni taqillatyapti.' }
                      ].map((t, idx) => (
                        <div key={idx} class="border border-slate-200 rounded-2xl p-4 hover:border-brand-500/50 transition flex items-center justify-between">
                          <div>
                            <div class="font-bold text-sm text-slate-800">{t.title}</div>
                            <div class="text-xs text-slate-500 mt-1">{t.msg}</div>
                          </div>
                          <button onClick={() => showToast('Bildirishnoma barcha foydalanuvchilarga yuborildi!')} class="text-xs font-bold bg-brand-50 text-brand-600 px-3 py-1.5 rounded-xl hover:bg-brand-100 transition shrink-0 ml-3">
                            Yuborish
                          </button>
                        </div>
                      ))}
                    </div>

                    {/* Phone Mockup Preview */}
                    <div class="flex flex-col items-center">
                      <div class="w-64 h-[440px] bg-slate-900 rounded-[38px] p-3 shadow-2xl border-4 border-slate-700 relative flex flex-col justify-between">
                        {/* Notch */}
                        <div class="w-24 h-4 bg-slate-800 rounded-full mx-auto mb-4"></div>
                        {/* Notification Bubble */}
                        <div class="bg-white/95 backdrop-blur-md rounded-2xl p-3 shadow-lg border border-white/40 space-y-1">
                          <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1.5">
                              <div class="w-4 h-4 rounded-md bg-brand-600 flex items-center justify-center text-[9px] text-white font-bold">I</div>
                              <span class="text-[11px] font-extrabold text-slate-800">INGLY</span>
                            </div>
                            <span class="text-[9px] text-slate-400">Hozirgina</span>
                          </div>
                          <div class="text-xs font-bold text-slate-900">7 kunlik streak'ingiz o'chmasin! 🔥</div>
                          <div class="text-[10px] text-slate-600 leading-tight">Bugungi 5 ta so'zni yodlab, olovchani saqlab qoling.</div>
                        </div>
                        {/* Home indicator */}
                        <div class="w-20 h-1 bg-white/40 rounded-full mx-auto mt-auto mb-1"></div>
                      </div>
                      <p class="text-xs font-semibold text-slate-400 mt-3">Smartfon blok-ekranidagi jonli ko'rinishi</p>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* Supabase Sozlamalari Modali */}
          {showSupabaseModal && (
            <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-5">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold">
                      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor"><path d="M11.996 2C6.474 2 2 6.474 2 11.996c0 5.523 4.474 9.996 9.996 9.996 5.523 0 9.996-4.473 9.996-9.996C23.992 6.474 19.519 2 11.996 2zm1.61 14.887l-4.502 2.6c-.347.2-.782-.05-.782-.45V13.8l-2.072 1.2c-.347.2-.782-.05-.782-.45v-5.2c0-.4.435-.65.782-.45l4.502 2.6c.347.2.782-.05.782-.45V5.813c0-.4.435-.65.782-.45l4.502 2.6c.347.2.782-.05.782-.45v5.2c0 .4-.435.65-.782.45l-4.502-2.6c-.347-.2-.782.05-.782.45v5.237c0 .4.435.65.782.45l2.072-1.2c.347-.2.782.05.782.45v.537z"/></svg>
                    </div>
                    <div>
                      <h3 class="text-lg font-bold text-slate-800">Supabase Sozlamalari</h3>
                      <p class="text-xs text-slate-400">Bulutli PostgreSQL bazasini boshqarish</p>
                    </div>
                  </div>
                  <button onClick={() => setShowSupabaseModal(false)} class="text-slate-400 hover:text-slate-600 text-sm font-bold p-1 cursor-pointer">✕</button>
                </div>

                <div class="space-y-4 text-xs">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Supabase Project URL</label>
                    <input 
                      type="text" 
                      placeholder="https://xyzcompany.supabase.co" 
                      value={supabaseUrl}
                      onChange={(e) => setSupabaseUrl(e.target.value)}
                      class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-brand-500"
                    />
                  </div>

                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Supabase Anon Key (Public Key)</label>
                    <textarea 
                      rows="3"
                      placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      value={supabaseKey}
                      onChange={(e) => setSupabaseKey(e.target.value)}
                      class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-brand-500 font-mono"
                    ></textarea>
                  </div>

                  <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 text-blue-800 leading-relaxed">
                    <p class="font-bold mb-1">Qayerdan olish mumkin?</p>
                    <p>Supabase loyihangizdan (supabase.com) <strong>Project Settings -> API</strong> bo'limiga kiring va <em>Project URL</em> hamda <em>anon (public)</em> kalitini nusxalab bu yerga joylang.</p>
                  </div>
                </div>

                <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
                  <button 
                    onClick={() => {
                      localStorage.removeItem('ingly_supabase_url');
                      localStorage.removeItem('ingly_supabase_key');
                      setSupabaseUrl('');
                      setSupabaseKey('');
                      setSupabaseConnected(false);
                      setShowSupabaseModal(false);
                      showToast('Supabase ulanishi uzildi.');
                    }}
                    class="px-4 py-2 text-xs font-semibold text-rose-600 hover:bg-rose-50 rounded-xl cursor-pointer"
                  >
                    O'chirish
                  </button>
                  <button 
                    onClick={() => {
                      const cleanUrl = supabaseUrl.trim();
                      const cleanKey = supabaseKey.trim();
                      if (cleanUrl && cleanKey) {
                        localStorage.setItem('ingly_supabase_url', cleanUrl);
                        localStorage.setItem('ingly_supabase_key', cleanKey);
                        initSupabaseConnection(cleanUrl, cleanKey);
                        showToast('Sozlamalar saqlandi, ulanish tekshirilmoqda...');
                      }
                      setShowSupabaseModal(false);
                    }}
                    class="px-5 py-2 text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 rounded-xl shadow-md transition cursor-pointer"
                  >
                    Saqlash va Ulanish
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
